<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Study Assistant</title>

  <style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
  }

  h1 {
    margin-top: 20px;
    font-weight: 500;
  }

  #chatBox {
    width: 400px;
    height: 500px;
    padding: 15px;
    overflow-y: auto;
    margin: 20px 0;

    /* 🔥 Glass effect */
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }

  .message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 75%;
    word-wrap: break-word;
  }

  .user {
    background: rgba(0, 123, 255, 0.7);
    align-self: flex-end;
  }

  .ai {
    background: rgba(255, 255, 255, 0.15);
    align-self: flex-start;
  }

  #inputArea {
    display: flex;
    width: 400px;
  }

  #userInput {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;

    background: rgba(255,255,255,0.1);
    color: white;
  }

  #userInput::placeholder {
    color: rgba(255,255,255,0.6);
  }

  button {
    padding: 12px;
    margin-left: 8px;
    border: none;
    border-radius: 10px;

    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.05);
  }
</style>
</head>

<body>

  <h1>AI Study Assistant</h1>

  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Ask something..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
